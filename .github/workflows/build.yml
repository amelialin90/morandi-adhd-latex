name: Build PDF

on:
  push:
    paths: ["**.tex", "**.cls", ".github/workflows/build.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            main-dark.tex
            main-en.tex
          latexmk_use_xelatex: true
          extra_system_packages: "font-noto font-noto-cjk"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: "*.pdf"
